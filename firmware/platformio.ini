; Firmware fuer THE WALL: SEENGREAT RGB Matrix HUB75 S3 V1.0 (ESP32-S3-WROOM-1-N16R8)
; mit Ocnvlia P2.5, 128 x 64, Treiber FM6126A. Pins und Hinweise: hardware/README.md
;
; Bauen und flashen aus diesem Ordner:
;   pio run -t upload        ; Port wird automatisch gesucht
;   pio device monitor       ; serielle Ausgabe, 115200

[platformio]
default_envs = wall

[env:wall]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = arduino

; 16 MB Flash (QIO) und 8 MB Octal-PSRAM. Ohne qio_opi startet das Modul nicht.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; Zwei App-Partitionen fuer Updates ueber das Netz, von Anfang an
board_build.partitions = partitions.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial ueber die USB-Buchse des Boards (USB Serial/JTAG des S3)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Eigene Pixelschrift statt Adafruit GFX
    -DNO_GFX

lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.15
    bblanchon/ArduinoJson@7.4.3

monitor_speed = 115200
